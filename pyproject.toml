[project]
name = "trading-chatbot"
version = "1.0.0"
description = "Financial Trading Platform Chatbot with RAG and Multi-Agent Orchestration"
authors = [
    { name = "Gayan Sanjeewa", email = "gsanjeewa1111@gmail.com" }
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Core Framework
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",

    # LangChain & LangGraph
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langgraph",
    "langchain-core",

    # Vector Database
    "pinecone",
    "langchain-pinecone",

    # Document Processing
    "pypdf",
    "python-multipart",

    # Monitoring & Tracing
    "langfuse",

    # LLM Providers
    "openai",

    # Async & HTTP
    "httpx",
    "aiohttp",

    # Data Validation & Processing
    "numpy",
    "pandas",

    # Testing
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",

    # Security & Validation
    "python-jose[cryptography]",
    "passlib[bcrypt]",

    # Logging & Monitoring
    "structlog",
    "python-json-logger",

    # Environment Management
    "python-dotenv",

    # Utils (compatible with langchain)
    "tenacity",
    "tiktoken",
    "colorlog",

    # Rate Limiting
    "slowapi",

    # MCP (Model Context Protocol)
    "mcp",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.uv.workspace]
members = [
    "frontend",
]
