services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trading-chatbot
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - chatbot-network

  redis:
    image: redis:7-alpine
    container_name: trading-chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - chatbot-network

 
  langfuse:
    image: langfuse/langfuse:2.24.1
    container_name: trading-chatbot-langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=R3PbZBy+z9/BoXxlKJsGACH3fm0TIFtfLvh+Ldx550Q=
      - SALT=R3PbZBy+z9/BoXxlKJsGACH3fm0TIFtfLvh+Ldx550Q=
      - TELEMETRY_ENABLED=false
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - chatbot-network

  postgres:
    image: postgres:15-alpine
    container_name: trading-chatbot-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chatbot-network

volumes:
  redis-data:
  postgres-data:

networks:
  chatbot-network:
    driver: bridge